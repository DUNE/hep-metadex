name: Documentation site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deploy runs for the same ref serialize; pull request builds never contend
# with the main deploy queue.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: zensical build --strict (staged docs tree)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # uv installs via Astral's official installer script, not the
      # astral-sh/setup-uv action: the DUNE organization's Actions policy
      # permits only actions owned by DUNE, created by GitHub, or on the
      # org allowlist, and astral-sh/setup-uv is none of those (the
      # workflow startup-fails otherwise). This constraint is specific to
      # the DUNE organization — re-evaluate this install step after any
      # hosting move. The uv version stays pinned below (ADR-0007).
      - name: Install uv (pinned via the official installer)
        run: curl -LsSf https://astral.sh/uv/0.13.7/install.sh | sh

      - name: Put uv on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync the maintainer toolchain from the lockfile
        run: uv sync --locked

      - name: Build the documentation site (strict gate)
        run: uv run tools/docs_site.py build

      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
