# hep-metadex documentation site — Zensical configuration.
#
# The committed config points docs_dir at docs/ in place (ADR-0007).
# Strict publishing builds run through tools/docs_site.py, which stages a
# rewritten copy and derives its own config (docs_dir -> .site-src) so
# out-of-tree links pass the strict gate. A hosting move edits repo_url and
# site_url here, never the docs sources.

[project]
site_name = "hep-metadex"
site_url = "https://dune.github.io/hep-metadex/"
repo_url = "https://github.com/DUNE/hep-metadex"
docs_dir = "docs"
site_dir = "site"
strict = true

nav = [
  { "Home" = "index.md" },
  { "Setup" = "setup.md" },
  { "Usage" = "usage.md" },
  { "Governance" = "governance.md" },
  { "HSF Affiliation" = "hsf-affiliation.md" },
  { "Maintainer Guide" = "maintainer.md" },
  { "Intent Prompt Guidelines" = "intent-prompt-guidelines.md" },
]
